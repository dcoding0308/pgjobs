<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pgjobs dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">pg</span>
        <h1>pgjobs</h1>
      </div>
      <div class="live" id="live" role="status" aria-live="polite">
        <span class="dot" id="live-dot"></span>
        <span id="live-text">connecting…</span>
      </div>
    </header>

    <main>
      <section class="tiles" aria-label="Totals">
        <div class="tile"><span class="tile-label">Ready</span><span class="tile-value" id="total-ready">–</span></div>
        <div class="tile"><span class="tile-label">Running</span><span class="tile-value" id="total-running">–</span></div>
        <div class="tile"><span class="tile-label" id="done-label">Done (5 min)</span><span class="tile-value" id="total-done">–</span></div>
        <div class="tile tile-dead"><span class="tile-label">Dead</span><span class="tile-value" id="total-dead">–</span></div>
      </section>

      <section class="panel" aria-labelledby="queues-title">
        <div class="panel-head">
          <h2 id="queues-title">Queues</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Queue</th>
                <th class="num">Ready</th>
                <th class="num">Scheduled</th>
                <th class="num">Running</th>
                <th class="num">Done (5 min)</th>
                <th class="num">Dead</th>
                <th class="num">Oldest waiting</th>
              </tr>
            </thead>
            <tbody id="queues-body">
              <tr><td colspan="7" class="empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="jobs-title">
        <div class="panel-head">
          <h2 id="jobs-title">Recent jobs</h2>
          <div class="controls">
            <div class="tabs" role="tablist" id="status-tabs">
              <button role="tab" data-status="" aria-selected="true">All</button>
              <button role="tab" data-status="queued">Queued</button>
              <button role="tab" data-status="running">Running</button>
              <button role="tab" data-status="succeeded">Succeeded</button>
              <button role="tab" data-status="dead">Dead</button>
            </div>
            <label class="select">
              <span class="visually-hidden">Queue</span>
              <select id="queue-filter"><option value="">All queues</option></select>
            </label>
            <button class="danger" id="requeue" hidden>Retry dead jobs</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="jobs">
            <thead>
              <tr>
                <th class="num">ID</th>
                <th>Task</th>
                <th>Queue</th>
                <th>Status</th>
                <th class="num">Attempts</th>
                <th>Created</th>
                <th>Last error</th>
              </tr>
            </thead>
            <tbody id="jobs-body">
              <tr><td colspan="7" class="empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">Job</h2>
        <button class="ghost" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <dl class="facts" id="drawer-facts"></dl>
      <h3>Payload</h3>
      <pre id="drawer-payload"></pre>
      <h3>Last error</h3>
      <pre id="drawer-error"></pre>
    </aside>

    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    <script src="/static/dashboard.js" defer></script>
  </body>
</html>
